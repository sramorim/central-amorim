name = "central-amorim"
# A conta (account_id, 32 hex) é injetada pelo CI via CLOUDFLARE_ACCOUNT_ID;
# deploy local usa a sessão `wrangler login`. Não fixar valor aqui.
main = "src/worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "central-amorim-db"
database_id = "7cc48398-9bc4-4be9-b789-c0ef28da9713"
migrations_dir = "migrations"
migrations_table = "d1_migrations"
