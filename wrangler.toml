name = "central-amorim"
# A conta (account_id, 32 hex) é injetada pelo CI via CLOUDFLARE_ACCOUNT_ID;
# deploy local usa a sessão `wrangler login`. Não fixar valor aqui.
main = "src/worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"

[vars]
# Fixados aqui para que o CI (`wrangler deploy`) aplique a mesma configuração
# em todo deploy. Ajuste os valores no Cloudflare Dashboard e os espelhe aqui.
PUBLIC_ORIGIN = "https://senhoramorim.com.br"
COOKIE_DOMAIN = ".senhoramorim.com.br"
COOKIE_SECURE = "true"
PIX_NAME = "SR. AMORIM"
PIX_CITY = "BRASIL"
PIX_AMOUNT_BRL = "9.99"
# Chave Pix (EVP) da Central — pública, usada no QR/copia-e-cola do checkout.
PIX_KEY = "ee2ee68d-3e68-4458-a32e-d34af93772ef"
# WhatsApp Business que recebe comprovantes (preenchido quando o chip chegar).
# WhatsApp Business que recebe comprovantes. # TEMPORÁRIO: número pessoal do dono;
# trocar pelo chip secundário quando chegar.
WA_NUMBER = "554797876098"
# E-mail(s) admin: o mesmo da conta que o dono usa para entrar no painel /admin.
# Ex.: ADMIN_EMAILS = "contato.centralamorim@gmail.com"
ADMIN_EMAILS = "sr.centralamorim@gmail.com"
# Origem do app SHANDON ELITE (remove o bloqueio de Origin e habilita CORS).
SHANDON_ORIGIN = "https://elite.senhoramorim.com.br"
# Limite diário de consultas Apify por instância do Worker (protege o crédito
# grátis do plano Apify Free — ~US$5/mês, sem cartão).
APIFY_DAILY_LIMIT = "100"

# SEKRETS — NUNCA declarar como var aqui (o deploy sobrescreveria o secret do
# Dashboard). Colar no Cloudflare: worker central-amorim > Settings > Variables
# and Secrets > + Add > tipo Secret, com o mesmo nome:
#   RAPIDAPI_WHATSAPP_KEY  -> chave do "WhatsApp OSINT" (provedor RapidAPI fallback)
#   APIFY_API_TOKEN        -> token do Apify (WhatsApp Data Lookup, provedor principal)

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "central-amorim-db"
database_id = "7cc48398-9bc4-4be9-b789-c0ef28da9713"
migrations_dir = "migrations"
migrations_table = "d1_migrations"
