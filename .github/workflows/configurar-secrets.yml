name: Configurar secrets do Worker

# Grava secrets direto no Worker `central-amorim` usando o CLOUDFLARE_API_TOKEN
# que o repositório já tem. Existe porque colar a chave no dashboard do
# Cloudflare falha de quatro jeitos silenciosos: nome com typo, conta errada,
# Worker errado e "salvei mas esqueci de Deploy". Aqui não há como errar o
# nome (a chave vem do Secret do GitHub) nem o destino (a conta e o Worker
# sao os mesmos do deploy automatico).
#
# O valor do secret NUNCA aparece no log: o wrangler le da entrada padrao e
# grava direto no Worker.
on:
  workflow_dispatch:
    inputs:
      api_token:
        description: 'Token do Apify (apify_api_...). Deixe vazio para nao alterar.'
        required: false
        type: string
      whatsapp_key:
        description: 'Chave do WhatsApp OSINT (RapidAPI). Opcional.'
        required: false
        type: string

jobs:
  configurar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Reusa o mesmo token de conta do deploy, entao nao ha chance de gravar
      # em outro lugar.
      - name: Gravar secret do Apify
        if: ${{ inputs.api_token != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VALOR: ${{ inputs.api_token }}
        run: printf '%s' "$VALOR" | npx wrangler secret put APIFY_API_TOKEN

      - name: Gravar secret do WhatsApp
        if: ${{ inputs.whatsapp_key != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VALOR: ${{ inputs.whatsapp_key }}
        run: printf '%s' "$VALOR" | npx wrangler secret put RAPIDAPI_WHATSAPP_KEY

      - name: Conferir o que ficou gravado
        if: ${{ always() }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler secret list
