<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Senhor Amorim — Central Amorim</title>
  <meta name="description" content="Central Amorim — meus projetos, ferramentas e conteúdos. Senhor Amorim." />
  <meta property="og:title" content="Senhor Amorim — Central Amorim" />
  <meta property="og:description" content="Meus projetos, ferramentas e conteúdos em um só lugar." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/logo-amorim.png" />
  <meta property="og:locale" content="pt_BR" />
  <meta name="theme-color" content="#050505" />
  <link rel="icon" type="image/png" href="/logo-amorim.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/css/style.css" />
</head>
<body class="bio">
  <main class="bio-wrap" id="inicio">
    <!-- LOGO OFICIAL -->
    <header class="bio-hero">
      <div class="bio-logo" aria-label="Senhor Amorim — Central Amorim">
        <img src="/logo-amorim.png" alt="Senhor Amorim — Central Amorim" class="bio-logo-img" />
      </div>
      <p class="bio-tagline">MEUS PROJETOS, FERRAMENTAS E CONTEÚDOS</p>
      <div class="bio-social" id="social-grid" aria-label="Canais oficiais"></div>
    </header>

    <!-- PROJETOS (ordem oficial) -->
    <section class="bio-projects" id="projetos" aria-label="Projetos">
      <div class="bio-list" id="projects-grid"></div>
    </section>

    <!-- RODAPÉ OFICIAL -->
    <footer class="bio-footer" role="contentinfo">
      <div class="bio-sign">Daniel Amorim</div>
      <div class="bio-rights">Todos os direitos reservados.<br>© 2026 Senhor Amorim.</div>
      <div class="bio-mini" id="footer-social" aria-label="Redes sociais"></div>
    </footer>
  </main>
  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
